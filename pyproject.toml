[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sg-urban-spine"
version = "0.1.0"
description = "Pace-layered spine (Bronze/Silver/Gold + transform contract) that rewires Singapore urban research models without rewriting them"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["pyarrow>=12", "pandas>=1.5", "geopandas>=0.13", "shapely>=2", "pyyaml>=6", "jsonschema>=4"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
spine = "spine.cli:main"

[tool.setuptools]
packages = ["spine"]

[tool.setuptools.package-data]
spine = ["_spec/*.json", "_spec/silver/*"]
